# Runs the bot together with the api-* services it uses.
# A downloaded release runs the images that GitHub publishes for each release, named under image.
# A Git clone builds the images from this folder and the sibling repository folders instead.
# Clone api-morshu next to this repository, then run: docker compose -f compose.stack.yml up --build
# Add --profile media to also run api-media, cloned next to this repository the same way.
# The services share a private network, so their ports are not published to the host.

# The fixed project name keeps the containers and volumes the same, whatever this folder is called.
# A downloaded release in a folder with a version in its name therefore finds the data of the previous one.
name: discord-bot-morshu

# Docker keeps at most two log files of 5 MB per container and overwrites the oldest.
# Without a limit, a log grows until the container is recreated.
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

# Each container may use at most its mem_limit, which is several times its normal use.
# A container that leaks past it is restarted alone, instead of slowing the whole computer.

services:
  bot:
    image: ghcr.io/lempki/discord-bot-morshu:latest
    build: .
    env_file:
      - .env
    environment:
      # Inside the stack the bot reaches each service by its compose name instead of localhost.
      API_MORSHU_URL: http://morshu:8000
      API_MEDIA_URL: http://media:8000
    volumes:
      - bot-data:/app/data
    depends_on:
      morshu:
        condition: service_healthy
      media:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m

  morshu:
    image: ghcr.io/lempki/api-morshu:latest
    build: ../api-morshu
    env_file:
      # Optional settings. The file may be absent.
      - path: ../api-morshu/.env
        required: false
    environment:
      # One secret, read from this repository's .env, so the bot and the service always agree.
      API_SECRET: ${API_MORSHU_SECRET:?Set API_MORSHU_SECRET in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      # Its startup loads a model, which takes longer than the other services.
      retries: 12
    # A video's speech passes through temporary files, and /tmp in memory keeps them off the disk.
    # They vanish with the container, even when it is killed in the middle of a video.
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g

  media:
    image: ghcr.io/lempki/api-media:latest
    build: ../api-media
    profiles: ["media"]
    env_file:
      # api-media's own settings, such as Spotify credentials. Both files are optional.
      # A Git clone keeps them in ../api-media/.env, and a downloaded release in api-media.env here.
      # api-media.env wins where both set the same setting.
      - path: ../api-media/.env
        required: false
      - path: api-media.env
        required: false
    environment:
      # One secret, read from this repository's .env, so the bot and the service always agree.
      API_SECRET: ${API_MEDIA_SECRET:-}
    volumes:
      # An optional YouTube cookies file, which YDL_COOKIES_FILE names as cookies/<file>.
      # MEDIA_COOKIES_DIR in .env picks the folder, such as ./cookies in a downloaded release.
      - ${MEDIA_COOKIES_DIR:-../api-media/cookies}:/app/cookies:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g

volumes:
  bot-data:
