[project]
name = "discord-bot-morshu"
version = "1.0.0"
description = "A Discord bot that generates Morshu TTS audio and lip-synced video via discord-api-morshu, with voice channel playback and file attachment delivery."
requires-python = ">=3.12"
dependencies = [
    # The voice extra installs PyNaCl and davey, the DAVE end-to-end encryption library.
    # Discord has required DAVE for every voice connection since March 2026.
    "discord.py[voice]>=2.7.1,<3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.uv]
# The bot is an application run from its directory, not an installable package.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
